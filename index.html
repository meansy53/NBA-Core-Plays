<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Core Plays</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --panel: #ECF0F2; --line: #d3dae0; --ink: #06184A; --muted: #5b6785;
    --navy: #06184A; --silver: #ECF0F2; --accent: #FE6A03; --core: #15803d; --bad: #b91c1c;
    --head-bg: #06184A; --head-ink: #ffffff; --btn-ink: #06184A;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #06184A; --panel: #0d2663; --line: #21367a; --ink: #ECF0F2; --muted: #a8b5d6;
      --navy: #06184A; --silver: #ECF0F2; --accent: #FE6A03; --core: #34d399; --bad: #ff8a8a;
      --head-bg: #FE6A03; --head-ink: #06184A; --btn-ink: #06184A;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 "Barlow", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 18px 16px 28px; }

  header { margin-bottom: 14px; }
  h1 { margin: 0; font: 700 30px/1.1 "Barlow Condensed", "Barlow", Arial, sans-serif; letter-spacing: .2px; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }

  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 12px 0 8px; }
  .tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--panel); }
  .tab { appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600;
    padding: 7px 18px; border-radius: 999px; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--head-bg); color: var(--head-ink); }
  .tab:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .grow { flex: 1; }
  .posbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px; }
  .pos { appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--muted); font: inherit; font-weight: 700;
    padding: 6px 16px; border-radius: 999px; cursor: pointer; min-width: 52px; }
  .pos:hover { color: var(--ink); }
  .pos[aria-pressed="true"] { background: var(--head-bg); border-color: var(--head-bg); color: var(--head-ink); }
  .pos:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .hq { background: var(--accent); color: var(--btn-ink); text-decoration: none; font-weight: 700; padding: 8px 16px; border-radius: 999px; white-space: nowrap; }
  .hq:hover { filter: brightness(1.08); }
  .hq:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  .group { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 8px; padding-bottom: 6px; border-bottom: 3px solid var(--accent); }
  .group h2 { margin: 0; font: 700 22px/1.1 "Barlow Condensed", "Barlow", Arial, sans-serif; letter-spacing: .3px; }
  .group span { color: var(--muted); font-size: 13px; }

  .cols, .row {
    display: grid; align-items: center; column-gap: 12px;
    grid-template-columns: 30px minmax(190px, 1.1fr) 82px 66px 82px 66px 2.6fr;
  }
  .cols { padding: 6px 12px; color: var(--muted); font-size: 12.5px; font-weight: 600; }
  .cols .c { text-align: center; }
  .row { padding: 12px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; background: var(--bg); }
  .row:hover { background: var(--panel); }
  .row[data-tag="core"] { border-left: 4px solid var(--core); padding-left: 9px; }
  .rank { color: var(--muted); font-weight: 700; }
  .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo { width: 36px; height: 36px; object-fit: contain; flex: 0 0 36px; }
  .logo.sm { width: 22px; height: 22px; flex-basis: 22px; }
  .logo[hidden] { display: none; }
  .nm { font-weight: 700; font-size: 16px; line-height: 1.2; }
  .mt { color: var(--muted); font-size: 13px; }
  .opp { display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; }
  .c { text-align: center; }
  .num { font-variant-numeric: tabular-nums; text-align: center; font-weight: 600; }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--core); color: #06210f; }
  .pill.other { background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
  .notes { line-height: 1.45; }
  .notes strong { font-weight: 700; }
  .warn { color: var(--bad); font-size: 12px; margin-top: 2px; }
  .m { display: none; }

  .msg { padding: 30px 16px; text-align: center; color: var(--muted); }
  .msg.err { color: var(--bad); }
  .msg small { display: block; margin-top: 6px; color: var(--muted); }
  footer { margin-top: 18px; color: var(--muted); font-size: 12.5px; }

  @media (max-width: 760px) {
    .cols { display: none; }
    .row { grid-template-columns: 24px 1fr auto auto; row-gap: 8px; }
    .opp, .tagc { display: none; }
    .who { grid-column: 2 / 3; }
    .num { text-align: right; }
    .notes { grid-column: 1 / -1; }
    .m { display: block; color: var(--muted); font-size: 11.5px; font-weight: 500; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">NBA Core Plays</h1>
    <div class="sub" id="sub">Our favorite plays by position.</div>
  </header>

  <div class="bar">
    <div class="tabs" role="tablist" aria-label="Site">
      <button class="tab" role="tab" id="tab-dk" data-site="dk" aria-selected="true">DraftKings</button>
      <button class="tab" role="tab" id="tab-fd" data-site="fd" aria-selected="false">FanDuel</button>
    </div>
    <span class="grow"></span>
    <a class="hq" id="hq" href="https://rotogrinders.com/lineuphq/nba?site=draftkings" target="_blank" rel="noopener">Build lineups in LineupHQ</a>
  </div>

  <div class="posbar" role="group" aria-label="Filter by position">
    <button class="pos" type="button" data-pos="ALL" aria-pressed="true">All</button>
    <button class="pos" type="button" data-pos="PG" aria-pressed="false">PG</button>
    <button class="pos" type="button" data-pos="SG" aria-pressed="false">SG</button>
    <button class="pos" type="button" data-pos="SF" aria-pressed="false">SF</button>
    <button class="pos" type="button" data-pos="PF" aria-pressed="false">PF</button>
    <button class="pos" type="button" data-pos="C" aria-pressed="false">C</button>
  </div>

  <div id="list" aria-live="polite"><div class="msg">Loading plays…</div></div>
  <footer>Plays are listed in the writer’s order of preference within each position.</footer>
</div>

<script>
// ---- Data: nba_coreplays.json, pushed by NBACorePlays.py ----
const DATA_URL = "nba_coreplays.json";
const LOGO = abbr => "https://rical-images.s3.amazonaws.com/team-logos/nba/" + abbr + ".png";
// If a logo is missing under one abbreviation, try the other common spelling.
const ALIASES = { PHX: "PHO", PHO: "PHX", GS: "GSW", GSW: "GS", NO: "NOP", NOP: "NO", NY: "NYK", NYK: "NY",
                  SA: "SAS", SAS: "SA", UTAH: "UTA", UTA: "UTAH", WSH: "WAS", WAS: "WSH", BRK: "BKN", BKN: "BRK", CHO: "CHA", CHA: "CHO" };

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// Notes support **bold**; everything else is plain text.
const notesHtml = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");

const money = v => { const n = Number(String(v).replace(/[$,]/g, "")); return isFinite(n) && v !== "" ? "$" + n.toLocaleString("en-US") : (v || "–"); };

function logo(team, small) {
  if (!team) return "";
  return '<img class="logo' + (small ? " sm" : "") + '" src="' + esc(LOGO(team)) + '" alt="" loading="lazy" data-team="' + esc(team) + '">';
}
// Missing logo: try the alias spelling once, then hide the image.
document.addEventListener("error", e => {
  const el = e.target;
  if (!(el instanceof HTMLImageElement) || !el.classList.contains("logo")) return;
  const t = el.dataset.team, alt = ALIASES[t];
  if (alt && !el.dataset.tried) { el.dataset.tried = "1"; el.src = LOGO(alt); } else el.hidden = true;
}, true);

function rowHtml(p) {
  const notFound = [p.pos, p.team, p.opp, p.salary, p.proj].some(v => /^not found$/i.test(v));
  const isCore = /^core/i.test(p.tag);
  const tag = p.tag ? '<span class="pill' + (isCore ? "" : " other") + '">' + esc(p.tag) + "</span>" : "";
  const meta = [p.pos, p.team].filter(v => v && !/^not found$/i.test(v)).join(" · ");
  const sp = p.spread == null ? "" : (p.spread > 0 ? "+" : "") + p.spread;
  const game = [sp, p.total == null ? "" : "O/U " + p.total].filter(Boolean).join(" · ");
  const status = p.status ? '<div class="warn">' + esc(p.status) + "</div>" : "";
  return '<div class="row" data-tag="' + (isCore ? "core" : "") + '">' +
    '<div class="rank">' + esc(p.rank) + "</div>" +
    '<div class="who">' + logo(p.team) + "<div><div class=\"nm\">" + esc(p.player) + '</div><div class="mt">' + esc(meta) + "</div>" +
      (game ? '<div class="mt">' + esc(game) + "</div>" : "") + status +
      (notFound ? '<div class="warn">Player not found on today’s slate</div>' : "") + "</div></div>" +
    '<div class="opp">' + logo(p.opp, true) + "<span>" + esc(/^not found$/i.test(p.opp) ? "" : p.opp) + "</span></div>" +
    '<div class="c tagc">' + tag + "</div>" +
    '<div class="num"><span class="m">Salary</span>' + esc(money(p.salary)) + "</div>" +
    '<div class="num"><span class="m">Proj</span>' + esc(/^not found$/i.test(p.proj) ? "–" : (p.proj || "–")) + "</div>" +
    '<div class="notes">' + notesHtml(p.notes) + "</div></div>";
}

const POS_OF = { "point guard": "PG", "shooting guard": "SG", "small forward": "SF", "power forward": "PF", "center": "C",
                 "pg": "PG", "sg": "SG", "sf": "SF", "pf": "PF", "c": "C" };
let pos = (new URLSearchParams(location.search).get("pos") || "ALL").toUpperCase();
if (!["ALL", "PG", "SG", "SF", "PF", "C"].includes(pos)) pos = "ALL";
let CURRENT = [];

function render(groups) {
  const list = $("list");
  const filled = groups.filter(g => g.plays.length && (pos === "ALL" || POS_OF[String(g.name).trim().toLowerCase()] === pos));
  if (!filled.length) {
    list.innerHTML = pos === "ALL"
      ? '<div class="msg">No plays have been posted yet.<small>Check back soon.</small></div>'
      : '<div class="msg">No ' + esc(pos) + ' plays have been posted yet.<small>Try another position or choose All.</small></div>';
    return;
  }
  let html = '<div class="cols"><div>#</div><div>Player</div><div class="c">Opp</div><div class="c">Tag</div><div class="c">Salary</div><div class="c">Proj</div><div>Notes</div></div>';
  for (const g of filled) {
    html += '<div class="group"><h2>' + esc(g.name) + "</h2><span>" + g.plays.length + " play" + (g.plays.length === 1 ? "" : "s") + "</span></div>";
    html += g.plays.map(rowHtml).join("");
  }
  list.innerHTML = html;
}

const cache = {};
let site = new URLSearchParams(location.search).get("site") === "fd" ? "fd" : "dk";

async function load(s) {
  if (!cache.data) {
    const res = await fetch(DATA_URL + "?t=" + Date.now());
    if (!res.ok) throw new Error("The data file returned an error (" + res.status + ").");
    cache.data = await res.json();
    if (cache.data.updated) $("sub").textContent = "Our favorite plays by position. Updated " +
      new Date(cache.data.updated).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  }
  return ((cache.data.sites || {})[s] || {}).groups || [];
}

async function show(s) {
  site = s;
  for (const b of document.querySelectorAll(".tab")) b.setAttribute("aria-selected", String(b.dataset.site === s));
  $("hq").href = "https://rotogrinders.com/lineuphq/nba?site=" + (s === "fd" ? "fanduel" : "draftkings");
  $("list").innerHTML = '<div class="msg">Loading plays…</div>';
  try { CURRENT = await load(s); render(CURRENT); }
  catch (e) {
    console.error(e);
    $("list").innerHTML = '<div class="msg err">Couldn’t load the plays.<small>' + esc(e.message || e) + " Refresh the page to try again.</small></div>";
  }
}

for (const b of document.querySelectorAll(".tab")) b.addEventListener("click", () => {
  const u = new URL(location.href); u.searchParams.set("site", b.dataset.site); history.replaceState(null, "", u);
  show(b.dataset.site);
});
for (const b of document.querySelectorAll(".pos")) {
  b.setAttribute("aria-pressed", String(b.dataset.pos === pos));
  b.addEventListener("click", () => {
    pos = b.dataset.pos;
    for (const x of document.querySelectorAll(".pos")) x.setAttribute("aria-pressed", String(x === b));
    const u = new URL(location.href);
    if (pos === "ALL") u.searchParams.delete("pos"); else u.searchParams.set("pos", pos);
    history.replaceState(null, "", u);
    render(CURRENT);
  });
}
show(site);
</script>
</body>
</html>
